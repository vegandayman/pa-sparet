<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Builder — På Spåret</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <header class="admin-topbar">
    <h1>Quiz Builder <span class="subtitle" id="quizTitleDisplay">New Quiz</span></h1>
    <div class="admin-topbar-actions">
      <button class="btn btn-secondary" id="loadSampleBtn">Load sample quiz</button>
      <button class="btn btn-secondary" id="importBtn">Import JSON</button>
      <button class="btn btn-secondary" id="editTitleBtn">Edit title</button>
      <button class="btn btn-primary" id="exportBtn">Export JSON</button>
    </div>
    <input type="file" id="importFileInput" accept=".json" class="visually-hidden" />
  </header>
  <nav class="round-rail" id="roundRail" aria-label="Rounds">
    <div class="round-rail-header"><span class="label">Rounds</span></div>
    <ul class="round-list" id="roundList"></ul>
    <div class="add-round-menu">
      <span class="label">Add a round</span>
      <div class="round-type-grid" id="addRoundGrid"></div>
    </div>
  </nav>
  <main class="admin-main" id="adminMain">
    <div class="editor-empty-state"><h2>No round selected</h2><p>Add a round on the left, or load the sample quiz to explore the builder.</p></div>
  </main>
</div>
<div class="modal-backdrop visually-hidden" id="titleModalBackdrop">
  <div class="panel modal">
    <h2>Quiz title</h2>
    <div class="field"><label class="label" for="quizTitleInput">Title</label><input type="text" id="quizTitleInput" /></div>
    <div class="modal-actions"><button class="btn btn-secondary" id="titleModalCancel">Cancel</button><button class="btn btn-primary" id="titleModalSave">Save</button></div>
  </div>
</div>
<div id="toastContainer"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
